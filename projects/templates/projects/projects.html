{% extends 'main.html' %}
{% load static %}
{% block content %}

<div class="w-full pt-20 font-serif bg-gradient-to-br from-blue-50 via-white to-emerald-100">
  <div class="max-w-5xl mx-auto px-6 py-10">

    <h1 class="text-5xl font-extrabold text-center text-emerald-800 mb-16 tracking-tight">Projects & Achievements</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for project in projects %}
      <a href="{{ project.link }}" 
         class="block bg-white rounded-xl shadow-md p-6 group transform transition duration-300 hover:-translate-y-1 hover:shadow-xl hover:bg-emerald-50">
        
        <h2 class="text-lg font-semibold text-emerald-700 group-hover:text-emerald-900">
          {{ project.title }}
        </h2>
        <p class="text-sm text-gray-600 mt-2">
          <strong>Course:</strong> {{ project.project_type }}
        </p>
      </a>
      {% endfor %}
    </div>

  </div>
</div>

{% endblock content %}
