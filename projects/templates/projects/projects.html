{% extends 'main.html' %}
{% load static %}
{% block content %}

<div class="w-full pt-20 font-serif bg-gradient-to-br from-blue-50 via-white to-emerald-100">
  <div class="max-w-5xl mx-auto px-6 py-10">

    <h1 class="text-5xl font-extrabold text-center text-emerald-800 mb-16 tracking-tight">Projects & Achievements</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for project in projects %}
      <div class="bg-white rounded-xl shadow-md p-6 transition-all duration-300 hover:shadow-lg">
        
        <!-- Project Title -->
        <h2 class="text-lg font-semibold text-emerald-700 mb-3">
          {{ project.title }}
        </h2>

 
        <!-- Details Button -->
        <a href="{% url 'project_detail' project.pk %}" 
           class="inline-block bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700 transition">
          View Details →
        </a>

      </div>
      {% endfor %}
    </div>

  </div>
</div>

{% endblock content %}
