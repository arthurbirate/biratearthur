{% extends 'main.html' %}
{% load static %}
{% block content %}

<div class="w-full pt-20 font-serif bg-gradient-to-br from-blue-50 via-white to-emerald-100">
  <div class="max-w-5xl mx-auto px-6 py-10">

    <h1 class="text-5xl font-extrabold text-center text-emerald-800 mb-16 tracking-tight">Projects & Achievements</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for project in projects %}
      <a href="{% url 'project_detail' project.pk %}" 
         class="block bg-white rounded-xl shadow-md p-6 group transition-all duration-300 transform hover:-translate-y-2 hover:scale-105 hover:shadow-2xl hover:bg-emerald-100">
        
        <!-- Project Title -->
        <h2 class="text-lg font-semibold text-emerald-700 transition-colors duration-300 group-hover:text-emerald-900">
          {{ project.title }}
        </h2>

        <!-- Optional: Show technologies preview -->
        {% if project.technologies_used %}
        <p class="mt-2 text-sm text-gray-600 line-clamp-2">
          {{ project.technologies_used }}
        </p>
        {% endif %}
      
      </a>
      {% endfor %}
    </div>

  </div>
</div>

{% endblock content %}
