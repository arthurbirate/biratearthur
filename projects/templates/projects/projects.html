{% extends 'main.html' %}
{% load static %}
{% block content %}

<div class="w-full pt-20 font-serif bg-gradient-to-br from-blue-50 via-white to-emerald-100">
  <div class="max-w-4xl mx-auto px-6 py-10">

    <h1 class="text-5xl font-extrabold text-center text-emerald-800 mb-16 tracking-tight">Projects & Achievements</h1>

    <ul class="space-y-8">
      {% for project in projects %}
      <li class="border-l-4 border-emerald-600 pl-6 bg-white shadow-sm rounded-xl py-4 hover:shadow-md transition duration-300">
        <h2 class="text-2xl font-semibold text-emerald-700">{{ project.title }}</h2>
        <p class="text-gray-600"><strong>Type:</strong> {{ project.project_type }}</p>
        <p class="text-gray-600"><strong>Tool:</strong> {{ project.tool_used }}</p>
      </li>
      {% endfor %}
    </ul>

  </div>
</div>

{% endblock content %}
